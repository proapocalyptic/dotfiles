## name: Dark Bride (fork of Dark Pride)
## author: apathyrecharge (Dark Price)
## license: GPLv3
## blurb: Dark trans-pride colour inspired theme, DE-integrated

## background             #1a0e16
foreground             #ebdbb2
selection_background   #2e1a2a
selection_foreground   #ebdbb2
cursor                 #741324

## black / bright black
## color0: pure black anchor — keep dark, it's the "black" slot not body text
## color8: lifted from #2e1a2a → #6b4a66 (same hue, much brighter — readable as dimmed text)
color0                 #1c0a20
color8                 #6b4a66

## red / bright red
## color1: lifted from #ca1444 → #e63060 (same crimson-pink hue, brighter, more saturated)
## color9: lifted from #741324 → #c42040 (same deep crimson hue, pushed up into readable range)
color1                 #e63060
color9                 #c42040

## green / bright green (teal / earth-brown)
## color2: lifted from #1c2f2f → #3d8c8c (same teal hue, dramatically brighter — was nearly black)
## color10: lifted from #5a3828 → #b07050 (same earth-brown hue, much brighter)
color2                 #3d8c8c
color10                #b07050

## yellow / bright yellow (dark gold / DE gold accent)
## color3: lifted from #B8860B → #c99a20 (same dark-gold hue, slightly brighter/cleaner)
## color11: keep #D4A422 — already bright enough, it's the primary gold accent
color3                 #c99a20
color11                #D4A422

## blue / bright blue (medium purple / slack purple)
## color4: keep #94469b — readable, matches DE link_text
## color12: lifted from #4A154B → #9a3ea0 (same slack-purple hue, dramatically brighter)
color4                 #94469b
color12                #9a3ea0

## magenta / bright magenta (warm pink-purple / bright yellow)
## color5: keep #cb6fa1 — good readability already
## color13: keep #F5C542 — bright yellow, fine
color5                 #cb6fa1
color13                #F5C542

## cyan / bright cyan (amber / dark purple ring)
## color6: keep #fea001 — amber, very readable
## color14: lifted from #3A0F3B → #7a2080 (same deep-purple hue, pushed into readable range)
color6                 #fea001
color14                #7a2080

## white / bright white (purpbright / parchment)
color7                 #cf98c1
color15                #ebdbb2

active_tab_foreground   #ebdbb2
active_tab_background   #2e1a2a
inactive_tab_foreground #d5cfbe
inactive_tab_background #1a0e16
