## name: Ink on Paper
## author: apathyrecharge
## license: GPLv3
## blurb: Light parchment theme — dark jeweltone inks on warm paper. Derived from Dark Bride palette.

background             #ebdbb2
foreground             #1c0a20
selection_background   #D4A422
selection_foreground   #1c0a20
cursor                 #741324

## opacity: force opaque — light themes wash out under compositor transparency
background_opacity     1.0

## black / bright black
## color0: deep plum-black — the primary ink anchor
## color8: muted plum — readable "dimmed" text on parchment
color0                 #1c0a20
color8                 #5a4060

## red / bright red (crimson inks)
## color1: deep crimson — bold, legible on light BG (was color9 in dark theme)
## color9: brighter crimson — accent red (was color1 in dark theme)
color1                 #c42040
color9                 #e63060

## green / bright green (teal / earth-brown inks)
## color2: jewel teal — darkened from #3d8c8c for parchment contrast
## color10: warm earth-brown — darkened from #b07050
color2                 #1f6060
color10                #7a4030

## yellow / bright yellow (amber-brown inks)
## color3: dark amber-brown — darkened from #c99a20 gold, readable on light BG
## color11: richer amber — deeper from #D4A422, avoids washing out
color3                 #8a6200
color11                #b07800

## blue / bright blue (plum / violet inks)
## color4: deep slack-purple — your #4A154B Hyprland accent, inky jeweltone
## color12: medium jewel violet — your @purpmed #6E1E70
color4                 #4A154B
color12                #6e1e70

## magenta / bright magenta (rose inks)
## color5: deep rose-crimson — darkened from #cb6fa1 pink-purple
## color13: mid inky rose — brighter but still jewel-toned
color5                 #941050
color13                #b03070

## cyan / bright cyan (amber / deep plum inks)
## color6: dark amber ink — darkened from #fea001, readable on parchment
## color14: inky plum-violet — darkened from #7a2080
color6                 #a06000
color14                #5a1060

## white / bright white (near-parchment tones)
## color7: warm off-white — your @textcolor2 #d5cfbe
## color15: parchment itself — matches background
color7                 #d5cfbe
color15                #ebdbb2

active_tab_foreground   #1c0a20
active_tab_background   #d5cfbe
inactive_tab_foreground #6b4a66
inactive_tab_background #ebdbb2
