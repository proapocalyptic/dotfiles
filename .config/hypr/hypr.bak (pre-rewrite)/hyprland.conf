###################
### ENVIRONMENT ###
###################
env = EDITOR,/home/alex/.local/bin/nvim-open
env = VISUAL,/home/alex/.local/bin/nvim-open
env = PATH,$HOME/.config/hypr/scripts:$HOME/.config/waybar:/home/alex/.local/bin:$PATH
env = SAL_USE_VCLPLUGIN,gtk4

env = QT6CT_STYLE,Adwaita-Dark
env = QT_QPA_PLATFORMTHEME,qt5ct

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

##

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,waylandenv = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,1.25


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = ranger
$menu = hyprlauncher

#################
### AUTOSTART ###
#################
source = ~/.config/hypr/autostart.conf
###################
### PERMISSIONS ###
###################
# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
 permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
#####################
### input ###
#####################
kb_options = caps:escape

input {
    # ...
    # ...
    touchpad {
	disable_while_typing = false
    }
}



#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(D4A42288) rgba(B33FB688) 108deg
    col.inactive_border = rgba(A87820aa)

    # Set to true enable resizing windows by clicking a:nd dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master



snap{
    enabled = true
    window_gap = 24 # pixels
    monitor_gap = 9 # pixels
}


}


scrolling{
column_width=0.8

}



# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
   # active_opacity = -1.9
    #inactive_opacity = -1.55/

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.4696
    }
}

layerrule = blur on, match:namespace waybar

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)
    }

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1



source = ~/.config/hypr/keybindings.conf


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules




# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title= ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

#Alex's cool external rulez
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/window-forms.conf
source = ~/.config/hypr/plugins.conf

#CUSTOM

general{
    resize_on_border = true
}


disable_splash_rendering = true

debug {
    disable_logs = false
}


windowrule = tag +bars-toggle-on, match:tag hyprbarred
windowrule = tag -bars-toggle-on, match:tag not-hyprbarred
windowrule = tag -hyprbarred, match:tag not-hyprbarred


windowrule = tag +bars-toggle-off, match:tag not-hyprbarred
windowrule = tag -bars-toggle-off, match:tag hyprbarred
windowrule = tag -not-hyprbarred,  match:tag hyprbarred



windowrule {
	name=hyprbar-off
	match:tag=bars-toggle-on
	hyprbars:no_bar=false
}

windowrule {
	name=hyprbar-on
	match:tag=bars-toggle-off
	hyprbars:no_bar=true
}
