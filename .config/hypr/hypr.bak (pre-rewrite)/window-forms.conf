#Custom Workspace window rules

windowrule = workspace 1 silent, match:class kitty-home
windowrule = workspace 1 silent, match:class kitty-broot
windowrule = workspace 1 silent, match:class kitty-scratcher
windowrule = workspace 2 silent, match:class kitty-ranger
windowrule = workspace 4 silent, match:class firefox
windowrule = workspace 3 silent, match:class vivaldi-stable
windowrule = workspace 5 silent, match:class kitty-nvim
windowrule = workspace 6 silent, match:class obsidian
windowrule = workspace 7 silent, match:class thunderbird 
windowrule = workspace 8 silent, match:class sysmon
windowrule = workspace 11 silent, match:class steam
windowrule = workspace 12 silent, match:class itch
windowrule = workspace 13 silent, match:class vlc

windowrule = workspace special:theZone silent, match:class special-terminal

windowrule {
name=ZoneDecoration
match:class=special-terminal
opacity=0.55
float=on
move= 836 3
size= 699 613
xray = on
animation = slide
}


#workspace names
workspace = 1, defaultName:TERMINAL, persistent:true, default:true
workspace = 2, defaultName:RNGR, persistent:true,  layoutopt:orientation:top
workspace = 4, defaultName:FRFX, persistent:true
workspace = 3, defaultName:VLDI, persistent:true, gapsout:0, gapsin:0
workspace = 5, defaultName:NVIM, persistent:true
workspace = 6, defaultName:OBSDN, persistent:true
workspace = 7, defaultName:MAIL, persistent:true
workspace = 8, defaultName:MONITOR, persistent:true, layoutopt:orientation:left
workspace = 11, defaultName:STEAM, persistent:false
workspace = 12, defaultName:ITCH, persistent:false
workspace = 13, defaultName:VLC, persistent:false


# scroll workspace 2
workspace = 2, layout:scrolling 
workspace = 2, layoutopt:direction:down

#no gaps fullscren

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

#kde-connect

windowrule{
	name = kde-connect
	match:class = ^(org.kde.kdeconnect.).*$
	hyprbars:no_bar=false
	workspace= 7
		size = (window_w*0.3) (window_h*0.3)
	tag=comms

}

windowrule{
	name = mail
	match:class = ^(thunderbird)$
	hyprbars:no_bar=false
	workspace= 7
		size = (window_w*0.7) (window_h*0.7)
	tag=comms
	}

windowrule{
	name = comms-styles
	match:tag = comms
	workspace = 7

}

#thunar defaults
windowrule {
	name = thunar
	match:class = thunur
	float = true
}


windowrule {
	name=hyprbar-whitelist
	match:initial_title=^(.*)$
	hyprbars:no_bar=true
}




#treat thunar instances launched from /home/ as a kind of special tag. In this case, the idea is to pair them with ranger on workspace 2. Also makes the window a bottom 
windowrule{ 
	name=workspace2-thunar
	match:initial_title=^home - Thunar$
	workspace=RNGR silent
	tag=workspace2-thunar
	float=off
}





#rules for workspace 1
windowrule{
	name=scratcher-stylin
	match:class=kitty-scratcher
	hyprbars:no_bar=true

}

windowrule{
	name=access-stylin
	match:class=kitty-access-menu
	hyprbars:no_bar=true
}

windowrule {
	name=kitty-home-settings
	match:initial_class=kitty-home
	hyprbars:no_bar=true
        exec=hyprctl dispatch layoutmsg swapwithmaster ignoremaster
	border_size=15px
}

##STEAM
windowrule {
name = steam-settings
float = true
match:title = ^(Friends List)$
match:class = ^(steam)$
}


##STEAM
windowrule {
name = steam-settings
float = true
match:title = ^(Steam Settings)$
match:class = ^(steam)$
}


windowrule {
name = easyeffects
float= true
match:class=com.github.wwmm.easyeffects
}


#nethogs size set
windowrule{
name=nethogs-specific
match:initial_title=nethogs
size= 807 285
}
#picture-in-picture rules

windowrule {
    name = picinpic-ff
    match:title = ^(Picture-in-Picture)$
    match:class = ^(firefox)$
    float = true
    pin = true
    size = 640 360
    move = 2  w156
    animation = slidedown
}

windowrule {
    name = picinpic-viv
    match:title = Picture in picture
    float = true
    pin = true
    size = 640 360
    move = 7 121
    animation = slidedown
}


windowrule {
name = file-picker
match:class = xdg-desktop-portal-gtk
match:title = ^(open file)$
float = on
}

windowrule {
 name = clipse
 match:class = ^(clipse)$
 float = on
 size = 622 652
 move = 908 155
 animation = slidedown
}


#volume widget for waybar
windowrule {
  name = loudness-control
match:class = org.pulseaudio.pavucontrol 
  float = on
border_size = 1
  xray=true
  size = 548 300
  max_size = 548 300
  pin = on
  opacity = 0.73
  move = 958 585
  animation = slideup
 # hyprbars:no_bar = false
}

windowrule {
  name = tooth-control
  match:class = blueman-manager
  float = on
border_size = 1
  size = 548 300
  max_size = 548 300
  pin = on
  move = 958 585
  animation = slideup
}

windowrule {
  name = bitwarden-ext-v
  match:initial_title = Bitwarden.*
  match:title = .*Bitwarden.*
  float = on
  #hyprbars:no_bar=false
  border_size = 1
  pin = off
  opacity = 0.93
  animation = slidedown

}


#opacity rules``
windowrule {
name = sysmon-transp
match:class = sysmon
opacity = 1.8
}


windowrule {
name = ff-clear
opaque = true
match:class = firefox
}

windowrule {
name = viv-clear
opaque = true
match:class = vivaldi-stable
}

windowrule {
name = vlc-clear
opaque = true
match:class = vlc
}

windowrule{ 
	name=rename
	match:title=^(Rename)$
	float=on
}
